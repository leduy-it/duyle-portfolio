<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 675" role="img" aria-labelledby="title description">
  <title id="title">The agentic publication gate</title>
  <desc id="description">A flow of source fragments passes through source, schema, evidence, and review gates before splitting into published and held outputs.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071821"/><stop offset=".55" stop-color="#123b40"/><stop offset="1" stop-color="#13242f"/></linearGradient>
    <linearGradient id="flow"><stop stop-color="#91ffe9"/><stop offset="1" stop-color="#f4bd7c"/></linearGradient>
    <filter id="glow"><feGaussianBlur stdDeviation="16"/></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#8af5de" stroke-opacity=".075"/></pattern>
  </defs>
  <rect width="1200" height="675" fill="url(#bg)"/>
  <rect width="1200" height="675" fill="url(#grid)"/>
  <circle cx="720" cy="280" r="310" fill="#49d5bc" opacity=".1" filter="url(#glow)"/>
  <path d="M110 370H1020" stroke="#73e9d5" stroke-opacity=".18" stroke-width="36" filter="url(#glow)"/>
  <path d="M110 370H1020" stroke="url(#flow)" stroke-width="3" stroke-dasharray="5 13"/>
  <path d="M790 370Q862 430 942 495H1050" fill="none" stroke="#f4b879" stroke-width="3" stroke-dasharray="5 13"/>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="13" letter-spacing="3" fill="#a6c9c4">
    <text x="92" y="96">FIELD NOTES / 2026</text>
    <text x="92" y="566">SOURCE CONTENT</text>
    <text x="1004" y="565">PUBLISH</text>
  </g>
  <g fill="none" stroke-width="3">
    <ellipse cx="330" cy="370" rx="39" ry="92" stroke="#9afbe7"/>
    <ellipse cx="510" cy="370" rx="39" ry="92" stroke="#9afbe7"/>
    <ellipse cx="690" cy="370" rx="39" ry="92" stroke="#9afbe7"/>
    <ellipse cx="870" cy="370" rx="39" ry="92" stroke="#f7bd7f"/>
  </g>
  <g fill="#e6f8ee" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="16" text-anchor="middle">
    <text x="330" y="250">SOURCE</text>
    <text x="510" y="250">SCHEMA</text>
    <text x="690" y="250">EVIDENCE</text>
    <text x="870" y="250">REVIEW</text>
  </g>
  <g fill="#9afbe7">
    <circle cx="144" cy="369" r="7"/><circle cx="189" cy="369" r="5"/><circle cx="249" cy="369" r="8"/><circle cx="413" cy="370" r="6"/><circle cx="594" cy="370" r="7"/><circle cx="752" cy="370" r="6"/><circle cx="998" cy="370" r="9"/>
  </g>
  <g fill="#f7bd7f"><circle cx="825" cy="401" r="6"/><circle cx="913" cy="476" r="7"/><circle cx="1002" cy="495" r="6"/></g>
  <g font-family="ui-sans-serif, system-ui" font-weight="600">
    <text x="92" y="166" font-size="46" fill="#f8f7eb">The publication gate.</text>
    <text x="92" y="615" font-size="25" fill="#a2f3df">Precision · coverage · cost</text>
  </g>
  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" letter-spacing="2" fill="#f8c18a"><text x="986" y="527">HOLD / REVIEW</text></g>
</svg>
